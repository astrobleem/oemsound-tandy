name: Unified Windows sound and native Setup
on:
  pull_request:
  push:
    branches: [main, feature/unified-sound-setup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Confirm exact reviewed head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Exercise production driver state and ownership
        run: python3 src/win30/DRIVER/HOSTTEST.PY --out /tmp/sound-driver
      - name: Exercise native installer parser and launcher policy
        run: |
          cc -x c -std=c89 -Wall -Wextra -Werror src/win30/SETUP/TESTSFX.C -o /tmp/setup-parser
          /tmp/setup-parser
          cc -x c -std=c89 -Wall -Wextra -Werror -I src/win30/LAUNCH src/win30/LAUNCH/TESTPOL.C -o /tmp/tplay-policy
          /tmp/tplay-policy
      - name: Verify complete native deliverables and reject corruption
        run: python3 tools/WINAMP/VERIFY.PY --self-test
      - name: Check the emulator status-bit regression
        run: python3 tools/WINAMP/QA/TESTP61.PY
